<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Ovelseskjoring</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef4f5;color:#172033}.app{max-width:620px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #0002}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#e2e8f0;padding:7px 11px;border-radius:99px;font-weight:700}.run{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f3f7f7;padding:11px;border-radius:12px}.stat b{display:block;font-size:1.2rem;margin-top:4px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800}.start{background:#16a34a;color:white}.stop{background:#dc2626;color:white}button:disabled{opacity:.4}.msg{padding:11px;border-radius:10px;background:#f8fafc;margin-top:12px;font-weight:600}.msg.error{background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}.trip{padding:10px 0;border-top:1px solid #e2e8f0}.small{color:#64748b;font-size:.86rem}@media(max-width:420px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body><main class="app">
<div class="top"><div><div class="small">KJOREBOK</div><h1>Ovelseskjoring</h1></div><span id="status" class="pill">Klar</span></div>
<section class="card">
<div class="stats"><div class="stat">Tid<b id="time">00:00:00</b></div><div class="stat">Distanse<b><span id="distance">0,00</span> km</b></div><div class="stat">GPS<b id="gps">Av</b></div></div>
<div class="buttons"><button id="start" type="button" class="start">Start tur</button><button id="stop" type="button" class="stop" disabled>Stopp tur</button></div>
<div id="msg" class="msg" aria-live="polite">Trykk Start tur. Tillat noyaktig posisjon nar iPhone spor.</div>
</section>
<section class="card"><h2>Lagrede turer</h2><b id="total">0 turer - 0,0 km</b><div id="trips"><p class="small">Ingen turer registrert.</p></div></section>
</main>
<script>
(function(){
'use strict';
var start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status'),msg=document.getElementById('msg'),time=document.getElementById('time'),distance=document.getElementById('distance'),gps=document.getElementById('gps');
var watch=null,timer=null,startMs=null,last=null,meters=0,running=false;
function message(t,c){msg.textContent=t;msg.className='msg '+(c||'');}
function clock(){if(startMs){var s=Math.floor((Date.now()-startMs)/1000);time.textContent=[Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(function(v){return String(v).padStart(2,'0');}).join(':');}}
function rad(x){return x*Math.PI/180;}
function hav(a,b){var R=6371000,dlat=rad(b.lat-a.lat),dlon=rad(b.lon-a.lon),q=Math.sin(dlat/2)*Math.sin(dlat/2)+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dlon/2)*Math.sin(dlon/2);return 2*R*Math.asin(Math.sqrt(q));}
function ok(p){var n={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:p.timestamp};gps.textContent=Math.round(n.acc)+' m';if(n.acc<=65){if(last){var d=hav(last,n),dt=(n.t-last.t)/1000;if(d>=3&&d<=Math.max(250,dt*55)){meters+=d;distance.textContent=(meters/1000).toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2});}}last=n;status.textContent='Tur pagar';status.className='pill run';message('GPS er aktiv. Hold appen apen under turen.','ok');}}
function fail(e){gps.textContent='Feil';status.textContent='GPS-feil';status.className='pill err';var t=e.code===1?'Posisjon er avslatt. Tillat Stedstjenester for Safari og sla pa Noyaktig posisjon.':e.code===2?'Ingen GPS-posisjon. Prov utendors og kontroller Stedstjenester.':'GPS svarte ikke. Stopp og prov Start tur igjen.';message(t,'error');}
function render(){var a=[];try{a=JSON.parse(localStorage.getItem('ovelsesturer')||'[]');}catch(e){}var sum=a.reduce(function(n,t){return n+(Number(t.km)||0);},0);document.getElementById('total').textContent=a.length+' turer - '+sum.toLocaleString('nb-NO',{minimumFractionDigits:1,maximumFractionDigits:2})+' km';document.getElementById('trips').innerHTML=a.length?a.map(function(t){return '<div class="trip"><b>'+new Date(t.date).toLocaleDateString('nb-NO')+' - '+Number(t.km||0).toLocaleString('nb-NO')+' km</b><div class="small">'+Math.round(t.seconds/60)+' min</div></div>';}).join(''):'<p class="small">Ingen turer registrert.</p>';}
start.addEventListener('click',function(){message('Start registrert. Ber iPhone om GPS...','');if(!window.isSecureContext){message('HTTPS kreves. Apne GitHub Pages-lenken i Safari.','error');return;}if(!navigator.geolocation){message('GPS er ikke tilgjengelig i denne nettleseren. Bruk Safari.','error');return;}start.disabled=true;stop.disabled=false;status.textContent='Venter pa GPS';gps.textContent='Soker';startMs=Date.now();meters=0;last=null;running=true;timer=setInterval(clock,1000);clock();watch=navigator.geolocation.watchPosition(ok,fail,{enableHighAccuracy:true,maximumAge:0,timeout:20000});});
stop.addEventListener('click',function(){if(!running)return;if(watch!==null)navigator.geolocation.clearWatch(watch);clearInterval(timer);var end=Date.now(),a=[];try{a=JSON.parse(localStorage.getItem('ovelsesturer')||'[]');}catch(e){}a.unshift({date:new Date(startMs).toISOString(),seconds:Math.floor((end-startMs)/1000),km:Number((meters/1000).toFixed(2))});try{localStorage.setItem('ovelsesturer',JSON.stringify(a));}catch(e){}running=false;startMs=null;watch=null;start.disabled=false;stop.disabled=true;gps.textContent='Av';status.textContent='Tur lagret';status.className='pill';message('Turen er stoppet og lagret pa denne enheten.','ok');render();});
window.addEventListener('error',function(e){message('Appfeil: '+e.message,'error');});render();
})();
</script></body></html>
