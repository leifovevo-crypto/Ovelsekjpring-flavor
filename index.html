<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest">
<title>Øvelseskjøring</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#eef4f5}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;padding:16px 16px 56px}.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 7px 25px #1232}.head{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.65rem;margin:0}h2{font-size:1.1rem}.pill{padding:7px 11px;border-radius:99px;background:#edf2f7;font-weight:700}.running{background:#dcfce7;color:#166534}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f3f7f7;border-radius:14px;padding:12px;text-align:center}.metric b{display:block;font-size:1.35rem}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}button{border:0;border-radius:14px;padding:15px;font-size:1rem;font-weight:800;cursor:pointer}.start{background:#16a34a;color:white}.stop{background:#dc2626;color:white}.secondary{background:#e2e8f0;color:#172033}.danger{background:#fee2e2;color:#991b1b}button:disabled{opacity:.4;cursor:not-allowed}label{display:block;font-weight:700;margin-top:12px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;margin-top:5px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.checks label{font-weight:500;margin:0;background:#f3f7f7;padding:10px;border-radius:10px}.checks input{width:auto;margin:0 6px 0 0}.trip{padding:12px 0;border-bottom:1px solid #e2e8f0}.trip:last-child{border:0}.small{font-size:.88rem;color:#64748b}.msg{min-height:1.3em;color:#9a3412;font-weight:650}.full{grid-column:1/-1}@media(max-width:410px){.grid{grid-template-columns:1fr}.checks{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{color:#e5e7eb;background:#07151a}.card{background:#10242b}.metric,.checks label{background:#18343c}.pill,.secondary{background:#29434b;color:#eef}.small{color:#a6bbc2}input,textarea{background:#0a1e25;color:white;border-color:#46616a}}
</style></head>
<body><main class="app">
<div class="head"><div><div class="small">KJØREBOK</div><h1>Øvelseskjøring</h1></div><span id="status" class="pill">Klar</span></div>
<section class="card"><div class="grid"><div class="metric"><span>Tid</span><b id="time">00:00:00</b></div><div class="metric"><span>Distanse</span><b><span id="distance">0,0</span> km</b></div><div class="metric"><span>GPS</span><b id="gps">Av</b></div></div><div class="buttons"><button id="start" class="start">▶ Start tur</button><button id="stop" class="stop" disabled>■ Stopp tur</button></div><p id="msg" class="msg" aria-live="polite"></p></section>
<section class="card"><h2>Opplysninger om turen</h2><label>Elev<input id="student" placeholder="Navn"></label><label>Ledsager<input id="companion" placeholder="Navn"></label><fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:700;margin-top:14px">Hva trente dere på?</legend><div class="checks" id="topics"><label><input type="checkbox" value="Blikk og observasjon">Blikk og observasjon</label><label><input type="checkbox" value="Fart og plassering">Fart og plassering</label><label><input type="checkbox" value="Kryss og vikeplikt">Kryss og vikeplikt</label><label><input type="checkbox" value="Rundkjøringer">Rundkjøringer</label><label><input type="checkbox" value="Landevei">Landevei</label><label><input type="checkbox" value="Parkering">Parkering</label><label><input type="checkbox" value="Mørkekjøring">Mørkekjøring</label><label><input type="checkbox" value="Selvstendig kjøring">Selvstendig kjøring</label></div></fieldset><label>Kommentar<textarea id="note" rows="3" placeholder="Hva gikk bra, og hva bør øves på neste gang?"></textarea></label></section>
<section class="card"><div class="head"><h2>Lagrede turer</h2><b id="total">0 turer · 0,0 km</b></div><div id="trips"><p class="small">Ingen turer registrert.</p></div><div class="buttons"><button id="csv" class="secondary">Last ned CSV</button><button id="clear" class="danger">Slett alle</button></div></section>
</main>
<script>
(()=>{const $=s=>document.querySelector(s), start=$('#start'),stop=$('#stop'),status=$('#status'),msg=$('#msg'),time=$('#time'),dist=$('#distance'),gps=$('#gps');let watch=null,timer=null,began=null,last=null,meters=0;
const trips=()=>JSON.parse(localStorage.getItem('ovelsesturer')||'[]'), save=a=>localStorage.setItem('ovelsesturer',JSON.stringify(a));
function hav(a,b){const R=6371000,p=x=>x*Math.PI/180,dLat=p(b.lat-a.lat),dLon=p(b.lon-a.lon),q=Math.sin(dLat/2)**2+Math.cos(p(a.lat))*Math.cos(p(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function clock(){let s=Math.floor((Date.now()-began)/1000);time.textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function position(p){gps.textContent='På';const n={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};if(n.acc<=50&&last){const d=hav(last,n);if(d>2&&d<1000){meters+=d;dist.textContent=(meters/1000).toLocaleString('nb-NO',{minimumFractionDigits:1,maximumFractionDigits:2})}}if(n.acc<=50)last=n}
function error(e){gps.textContent='Feil';msg.textContent='GPS kunne ikke brukes: '+e.message+'. Kontroller posisjonstilgang og HTTPS.'}
start.onclick=()=>{if(!navigator.geolocation){msg.textContent='Nettleseren støtter ikke GPS.';return}began=Date.now();meters=0;last=null;msg.textContent='';status.textContent='Tur pågår';status.classList.add('running');start.disabled=true;stop.disabled=false;timer=setInterval(clock,1000);clock();watch=navigator.geolocation.watchPosition(position,error,{enableHighAccuracy:true,maximumAge:1000,timeout:15000})};
stop.onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);clearInterval(timer);const end=Date.now(),topics=[...document.querySelectorAll('#topics input:checked')].map(x=>x.value);const data=trips();data.unshift({id:end,date:new Date(began).toISOString(),end:new Date(end).toISOString(),seconds:Math.floor((end-began)/1000),km:+(meters/1000).toFixed(2),student:$('#student').value.trim(),companion:$('#companion').value.trim(),topics,note:$('#note').value.trim()});save(data);status.textContent='Lagret';status.classList.remove('running');start.disabled=false;stop.disabled=true;gps.textContent='Av';render();began=null;watch=null};
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const a=trips(),sum=a.reduce((x,t)=>x+(t.km||0),0);$('#total').textContent=`${a.length} turer · ${sum.toLocaleString('nb-NO',{minimumFractionDigits:1,maximumFractionDigits:2})} km`;$('#trips').innerHTML=a.length?a.map(t=>`<div class="trip"><b>${new Date(t.date).toLocaleDateString('nb-NO')} · ${t.km.toLocaleString('nb-NO')} km</b><div>${Math.round(t.seconds/60)} min${t.student?' · Elev: '+esc(t.student):''}</div><div class="small">${esc(t.topics.join(', '))}${t.note?' · '+esc(t.note):''}</div></div>`).join(''):'<p class="small">Ingen turer registrert.</p>'}
$('#csv').onclick=()=>{const a=trips();if(!a.length){msg.textContent='Ingen turer å eksportere.';return}const rows=[['Dato','Start','Slutt','Minutter','Kilometer','Elev','Ledsager','Fokus','Kommentar'],...a.map(t=>[new Date(t.date).toLocaleDateString('nb-NO'),new Date(t.date).toLocaleTimeString('nb-NO'),new Date(t.end).toLocaleTimeString('nb-NO'),Math.round(t.seconds/60),String(t.km).replace('.',','),t.student,t.companion,t.topics.join(' | '),t.note])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='ovelseskjoring.csv';a.click();URL.revokeObjectURL(u)};
$('#clear').onclick=()=>{if(confirm('Slette alle lagrede turer på denne enheten?')){localStorage.removeItem('ovelsesturer');render()}};render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();</script></body></html>
